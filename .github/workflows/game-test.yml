name: Game tests

# The reusable GTNH build workflow runs `check`, which now includes the JUnit suite, Spotless/Checkstyle, the JaCoCo
# floor and the game-test compilation. This workflow adds the part `check` cannot do on its own: a real dedicated
# server and real Forge startup. `./gradlew gameTestServer` writes eula.txt/server.properties itself and exits with the
# game test's result.

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-test:
    name: Unit tests + dedicated-server game tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Gradle daemon follows gradle/gradle-daemon-jvm.properties (Java 25). Install Java 8 too: the test suite
      # runs on a Java 8 toolchain, matching the mod's bytecode target and Mockito 4.x. Zulu keeps the Java 8 download
      # off the Adoptium GitHub asset that has intermittently returned a corrupt archive.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests and the in-game tests
        run: ./gradlew test gameTestServer --stacktrace

      - name: Check the game-test marker
        # The test mod prints SOLARFLUX_GAMETEST_OK only after every assertion has passed and the game has to shut down
        # cleanly; a crash mid-run therefore fails here instead of silently passing.
        # Grep every log: FML routes mod stdout to fml-server-latest.log, not vanilla latest.log, and also writes
        # fml-junk-earlystartup.log, which sorts before latest.log.
        run: |
          ls -l run/server/logs/ || true
          test -n "$(ls run/server/logs/*.log 2>/dev/null)" || { echo "no server log was written"; exit 1; }
          grep -hE "\[SOLARFLUX-GAMETEST\] [0-9]+/[0-9]+ checks passed" run/server/logs/*.log || true
          grep -hq "SOLARFLUX_GAMETEST_OK" run/server/logs/*.log
          ! grep -hq "SOLARFLUX_GAMETEST_FAILED" run/server/logs/*.log

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solarflux-game-test-log
          path: run/server/logs/
          if-no-files-found: warn

      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solarflux-coverage
          path: build/reports/jacoco/
          if-no-files-found: warn
